<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الحلاق</title>
</head>
<body>
    <h1>دخول الحلاقين</h1>
    <input type="password" id="pass" placeholder="أدخل رقمك السري">
    <button onclick="login()">دخول</button>
    <h2 id="barberName"></h2>
    <table id="myTable" border="1">
        <thead><tr><th>الرقم</th><th>اسم الزبون</th></tr></thead>
        <tbody id="listBody"></tbody>
    </table>

    <script>
        async function login() {
            const password = document.getElementById('pass').value;
            const res = await fetch('/admin-login', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ password }) 
            });
            if(res.ok) {
                const data = await res.json();
                document.getElementById('barberName').innerText = "أهلاً " + data.name;
                const tbody = document.getElementById('listBody');
                tbody.innerHTML = '';
                data.patients.forEach((p, i) => {
                    tbody.innerHTML += `<tr><td>${i + 1}</td><td>${p.name}</td></tr>`;
                });
            } else {
                alert("رقم سري خاطئ!");
            }
        }
    </script>
</body>
</html>
