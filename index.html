<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الحلاقة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="page1" class="page active">
        <div class="overlay">
            <h1>مرحباً بك في صالون الحلاقة الفاخر</h1>
            <p>احجز موعدك الآن مع أفضل الحلاقين بضغط زر واحدة</p>
            <button onclick="nextPage('page2')">الدخول إلى الحجز</button>
        </div>
    </div>

    <div id="page2" class="page">
        <div class="overlay">
            <h2>اختر حلاقك المفضل</h2>
            <div class="barbers-container">
                <div class="barber-card" onclick="selectBarber('حلاق واحد')">
                    <h3>حلاق واحد</h3>
                </div>
                <div class="barber-card" onclick="selectBarber('حلاق اثنان')">
                    <h3>حلاق اثنان</h3>
                </div>
                <div class="barber-card" onclick="selectBarber('حلاق ثلاثة')">
                    <h3>حلاق ثلاثة</h3>
                </div>
            </div>
            <button class="back-btn" onclick="nextPage('page1')">تراجع</button>
        </div>
    </div>

    <div id="page3" class="page">
        <div class="overlay">
            <h2>تأكيد الحجز مع: <span id="chosen-barber"></span></h2>
            <form id="booking-form" onsubmit="submitForm(event)">
                <input type="text" id="username" placeholder="أدخل اسمك الكريم" required>
                <input type="tel" id="phone" placeholder="رقم الهاتف" required>
                <button type="submit">تأكيد الحجز النهائي</button>
            </form>
            <button class="back-btn" onclick="nextPage('page2')">تراجع</button>
        </div>
    </div>

    <div id="page4" class="page">
        <div class="overlay">
            <div class="success-box">
                <h2>✓ تم تأكيد التسجيل بنجاح!</h2>
                <p>شكراً لك، ننتظر زيارتك في الموعد المحدد.</p>
                <button onclick="nextPage('page1')">العودة للرئيسية</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
