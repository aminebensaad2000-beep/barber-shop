<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صالون الحلاقة الفاخر</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="booking-page" class="container">
        <h1>مرحباً بك في صالون الحلاقة</h1>
        <p class="subtitle">احجز موعدك الآن بسهولة</p>
        
        <form id="booking-form">
            <div class="form-group">
                <label for="name">الاسم الكريم:</label>
                <input type="text" id="name" required placeholder="أدخل اسمك الكامل">
            </div>
            
            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" required placeholder="0XXXXXXXXX">
            </div>
            
            <div class="form-group">
                <label for="barber">اختر الحلاق:</label>
                <select id="barber" required>
                    <option value="" disabled selected>اختر من القائمة...</option>
                    <option value="حلاق 1">الحلاق الأول</option>
                    <option value="حلاق 2">الحلاق الثاني</option>
                    <option value="حلاق 3">الحلاق الثالث</option>
                </select>
            </div>
            
            <button type="submit" class="btn">تأكيد الحجز</button>
        </form>
        <footer class="footer">
            <a href="#admin-page" id="admin-link">لوحة تحكم الإدارة</a>
        </footer>
    </div>

    <div id="admin-page" class="container hidden">
        <div class="admin-header">
            <h2>لوحة إدارة الحجوزات للصالون</h2>
            <button id="logout-btn" class="btn-secondary">تسجيل الخروج</button>
        </div>

        <div class="barber-section">
            <h3>📅 حجوزات الحلاق الأول</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>رقم الهاتف (اضغط للاتصال)</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="table-barber1">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="barber-section">
            <h3>📅 حجوزات الحلاق الثاني</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>رقم الهاتف (اضغط للاتصال)</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="table-barber2">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="barber-section">
            <h3>📅 حجوزات الحلاق الثالث</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>رقم الهاتف (اضغط للاتصال)</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="table-barber3">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
