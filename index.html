<select id="barber">
    <option value="أحمد">أحمد</option>
    <option value="ياسين">ياسين</option>
    <option value="صابر">صابر</option>
</select>
<input type="text" id="name" placeholder="اسمك الكريم">
<button onclick="book()">حجز الموعد</button>

<a href="admin.html">دخول الحلاقين (الإدارة)</a>

<script>
async function book() {
    const name = document.getElementById('name').value;
    const barber = document.getElementById('barber').value;
    await fetch('/book', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name, barber }) });
    alert("تم التسجيل يا " + name);
}
</script>
