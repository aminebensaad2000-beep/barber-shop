<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <title>صالون الحلاقة</title>
</head>
<body>
    <div class="container">
        <h1>صالون الحلاقة</h1>
        <input id="name" placeholder="الاسم الكريم">
        <input id="phone" placeholder="رقم الهاتف">
        <select id="barber">
            <option>أحمد</option><option>ياسين</option><option>صابر</option>
        </select>
        <button onclick="book()">تسجيل الحجز</button>
        <br>
        <a href="admin.html" style="color:gold;">بوابة الحلاقين</a>
    </div>
    <script>
        async function book() {
            const data = {name:document.getElementById('name').value, phone:document.getElementById('phone').value, barber:document.getElementById('barber').value};
            const res = await fetch('/book', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
            alert(await res.text());
        }
    </script>
</body>
</html>
